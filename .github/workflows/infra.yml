# The cloud VM (infra/): formatting, the machine contract, validation, tests against mocked providers, ShellCheck on the
# on-VM script, and the cloud.py command's unit tests. Nothing here needs a cloud account or credentials.
name: Infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOFU_VERSION: 1.11.5

jobs:
  opentofu:
    name: OpenTofu format, contract, validate and mocked tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Format
        run: tofu fmt -check -recursive -diff infra
      - name: Every cloud's machine module honours the machine contract
        run: python3 infra/contract/check.py
      - name: Validate every module and stack, and run the modules' tests
        run: |
          set -euo pipefail
          export TF_PLUGIN_CACHE_DIR="$HOME/.tofu-plugins" && mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in infra/modules/*/* infra/stacks/*/*; do
            [ -d "$dir" ] || continue
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false -no-color > /dev/null
            tofu -chdir="$dir" validate -no-color
            if [ -d "$dir/tests" ]; then tofu -chdir="$dir" test -no-color; fi
            echo "::endgroup::"
          done

  cloud-command:
    name: cloud.py and the on-VM script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.12"]  # 3.9: the oldest the command supports (macOS's own python3)
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: ShellCheck the on-VM script
        run: shellcheck infra/modules/common/machine-bootstrap/files/batchiq.sh
      - uses: astral-sh/setup-uv@v7
      - name: Unit tests (fake OpenTofu, SSH and AWS; the OpenTofu wrapper also against the real binary)
        run: uv run --no-project --python "${{ matrix.python }}" python -m unittest discover -v -s infra/cloud/tests -t infra/cloud/tests
