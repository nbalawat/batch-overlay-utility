[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "batchiq"
version = "0.1.0"
description = "Batch Intelligence Overlay: AI system of engagement over existing enterprise schedulers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=2.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["batchiq*"]

[tool.setuptools.package-data]
batchiq = ["catalog/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "SIM102", "SIM108"]   # B008: FastAPI's Depends() in defaults is the documented pattern
