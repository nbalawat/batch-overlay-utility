# Portable ingress (ingress-nginx by default). Cloud overlays only change the class and annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: batchiq
spec:
  ingressClassName: nginx
  rules:
    - host: batchiq.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: ui, port: {number: 80}}}
